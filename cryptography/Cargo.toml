[package]
name = "cryptography"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = { version = "3.0.0", features = ["rand", "zeroize"] }
bitcoin = "0.32"
bs58 = "0.5.1"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
hex = "0.4"
hmac = "0.12"
k256 = { version = "0.14", features = ["ecdsa"] }
sha2 = "0.10"
sha3 = "0.10"
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.2"
