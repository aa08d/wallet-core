[package]
name = "cryptography"
version = "0.1.0"
edition = "2024"

[dependencies]
bip39 = { version = "3.0.0", features = ["rand", "zeroize"] }
bs58 = "0.5.1"
ed25519-dalek = { version = "2.2.0", features = ["zeroize"] }
hmac = "0.12"
sha2 = "0.10"
serde_json = "1.0.154"
thiserror = "2.0.21"
zeroize = "1.9.2"
